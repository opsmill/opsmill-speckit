---
# yamllint disable rule:truthy
# Install every component of this repo on the oldest spec-kit version the
# manifests declare (requires.speckit_version). Blocking on pull requests.
name: "Install"
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  install-minimum:
    name: "Install on the minimum spec-kit version"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v7"
      - name: "Install UV"
        uses: "astral-sh/setup-uv@v7"
      - name: "Read the minimum spec-kit version"
        id: "speckit"
        # Assigned first so that a failure of the script fails the step.
        run: |
          version=$(uv run -q .github/scripts/check_install.py min-version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Old spec-kit releases are not on PyPI, so install from the git tag.
      - name: "Install spec-kit ${{ steps.speckit.outputs.version }}"
        run: uv tool install "git+https://github.com/github/spec-kit@v${{ steps.speckit.outputs.version }}"
      - name: "Install and check every component"
        run: uv run .github/scripts/check_install.py
