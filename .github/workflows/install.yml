---
# yamllint disable rule:truthy
name: "Install"
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  install:
    name: "Install on spec-kit ${{ matrix.speckit }}"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    # 0.11.9 is the version most consumer repos run today. 1.2.3 is the
    # migration target; it does not block until opsmill-speckit 2.0.0.
    continue-on-error: ${{ matrix.speckit == '1.2.3' }}
    strategy:
      fail-fast: false
      matrix:
        speckit:
          - "0.11.9"
          - "1.2.3"
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v7"
      - name: "Install UV"
        uses: "astral-sh/setup-uv@v7"
      - name: "Install spec-kit ${{ matrix.speckit }}"
        run: "uv tool install specify-cli==${{ matrix.speckit }}"
      - name: "Install the extension and presets"
        run: ".github/scripts/check-install.sh"
