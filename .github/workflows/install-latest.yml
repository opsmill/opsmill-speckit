---
# yamllint disable rule:truthy
# Install every component of this repo on the latest Spec Kit release, once a
# week. A failure opens an issue instead of blocking pull requests.
name: "Install on latest Spec Kit"
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-latest:
    name: "Install on the latest Spec Kit version"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    outputs:
      version: ${{ steps.speckit.outputs.version }}
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
      - name: "Install UV"
        uses: "astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78" # v7.6.0
      - name: "Install the latest Spec Kit"
        id: "speckit"
        run: |
          uv tool install specify-cli
          version=$(uv tool list | sed -n 's/^specify-cli v//p')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: "Install and check every component"
        run: uv run .github/scripts/check_install.py

  report:
    name: "Open an issue on failure"
    needs: install-latest
    if: failure()
    runs-on: "ubuntu-latest"
    permissions:
      issues: write
    steps:
      - name: "Open or update the issue"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.install-latest.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Install fails on spec-kit ${VERSION:-latest}"
          body="The weekly install check failed on spec-kit ${VERSION:-latest}: ${RUN_URL}"
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

  close:
    name: "Close issues once the install passes"
    needs: install-latest
    if: success()
    runs-on: "ubuntu-latest"
    permissions:
      issues: write
    steps:
      - name: "Close open install-failure issues"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.install-latest.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue list --state open --search 'in:title "Install fails on spec-kit"' --json number,title \
            --jq '.[] | select(.title | startswith("Install fails on spec-kit")) | .number' |
            while read -r number; do
              gh issue close "$number" --comment "The weekly install check passes again on spec-kit ${VERSION}: ${RUN_URL}"
            done
