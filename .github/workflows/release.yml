---
# yamllint disable rule:truthy
# When a GitHub Release vX.Y.Z is published, build the zips of the tagged
# commit and attach the ones that catalog/ points to vX.Y.Z. Projects install
# them from there through the opsmill catalogs.
name: "Release"
on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  zips:
    name: "Attach the release zips"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
      - name: "Install UV"
        uses: "astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78" # v7.6.0
      - name: "Build the zips and check them against catalog/"
        # Fails, and attaches nothing, when a zip differs from its catalog entry.
        run: |
          uv run .github/scripts/build_release.py assets "${GITHUB_REF_NAME#v}" "$RUNNER_TEMP/zips" > "$RUNNER_TEMP/assets"
      - name: "Attach the zips to the release"
        env:
          GH_TOKEN: "${{ github.token }}"
        run: xargs gh release upload "$GITHUB_REF_NAME" < "$RUNNER_TEMP/assets"
