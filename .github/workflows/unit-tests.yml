---
# yamllint disable rule:truthy
# Run the unit tests of the CI scripts. Blocking on pull requests.
name: "Unit tests"
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  unit-tests:
    name: "Test the CI scripts"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v7"
      - name: "Install UV"
        uses: "astral-sh/setup-uv@v7"
      - name: "Test the install check"
        run: uvx --with "packaging>=24" --with "pyyaml>=6" pytest .github/scripts/tests/install_check
