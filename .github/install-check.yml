# Extensions that our commands and presets need but that this repo does not
# ship. A URL installs that archive; null installs the extension bundled with
# spec-kit.
extensions:
  # prep, implement and auto commit with speckit-checkpoint-commit from this extension.
  checkpoint: "https://github.com/aaronrsun/spec-kit-checkpoint/archive/refs/tags/v1.0.0.zip"
  # critique-opsmill overrides speckit.critique.run from this extension.
  critique: "https://github.com/arunt14/spec-kit-critique/archive/refs/tags/v1.0.0.zip"
  # jira-branch overrides speckit.git.feature from this extension.
  git: null
  # reconcile-opsmill overrides speckit.reconcile.run from this extension.
  reconcile: "https://github.com/stn1slv/spec-kit-reconcile/archive/886f1dd.zip"

# Python packages that spec-kit's scripts need on a developer machine, as listed
# in the README. The check runs those scripts with a fresh Python that has only
# these packages, so a requirement missing from this list fails the check.
python_packages:
  # spec-kit 1.2 reads preset manifests with PyYAML when it composes templates.
  - pyyaml
