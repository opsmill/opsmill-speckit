schema_version: "1.0"

bundle:
  id: "opsmill-sdd"
  name: "OpsMill spec-driven development"
  version: "0.1.0"
  role: "developer"
  description: "The OpsMill workflow commands and Spec Kit workflows, with the critique, checkpoint and reconcile extensions they use."
  author: "opsmill"
  repository: "https://github.com/opsmill/opsmill-speckit"
  license: "Apache-2.0"

requires:
  speckit_version: ">=1.2.4"

# Every component comes from the opsmill catalogs (catalog/), which a project
# declares in .specify/*-catalogs.yml.
provides:
  extensions:
    - id: "opsmill"
      version: "1.4.0"
      source: "opsmill"
    # prep, implement and auto commit with speckit-checkpoint-commit from this extension.
    - id: "checkpoint"
      version: "1.0.0"
      source: "opsmill"
    - id: "critique"
      version: "1.0.0"
      source: "opsmill"
    - id: "reconcile"
      version: "1.3.1"
      source: "opsmill"
  presets:
    # Replaces speckit.critique.run from the critique extension.
    - id: "critique-opsmill"
      version: "1.0.0"
      source: "opsmill"
      priority: 10
      strategy: "replace"
    # Replaces speckit.reconcile.run from the reconcile extension.
    - id: "reconcile-opsmill"
      version: "1.1.0"
      source: "opsmill"
      priority: 10
      strategy: "replace"
  # Run with `specify workflow run opsmill-auto`; each step runs one of the
  # opsmill commands above.
  workflows:
    - id: "opsmill-prep"
      version: "1.0.0"
      source: "opsmill"
    - id: "opsmill-implement"
      version: "1.0.0"
      source: "opsmill"
    - id: "opsmill-auto"
      version: "1.0.0"
      source: "opsmill"
