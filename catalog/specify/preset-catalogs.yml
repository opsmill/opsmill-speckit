# Copy to .specify/preset-catalogs.yml and commit it. A project file replaces
# Spec Kit's built-in catalogs, so it lists them again after ours.
catalogs:
  - name: "opsmill"
    url: "https://raw.githubusercontent.com/opsmill/opsmill-speckit/main/catalog/preset-catalog.json"
    priority: 1
    install_allowed: true
    description: "OpsMill presets"
  - name: "default"
    url: "https://raw.githubusercontent.com/github/spec-kit/main/presets/catalog.json"
    priority: 2
    install_allowed: true
    description: "Built-in catalog of installable presets"
  - name: "community"
    url: "https://raw.githubusercontent.com/github/spec-kit/main/presets/catalog.community.json"
    priority: 3
    install_allowed: false
    description: "Community-contributed presets (discovery only)"
