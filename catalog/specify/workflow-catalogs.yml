# Copy to .specify/workflow-catalogs.yml and commit it. A project file replaces
# Spec Kit's built-in catalogs, so it lists them again after ours.
catalogs:
  - name: "opsmill"
    url: "https://raw.githubusercontent.com/opsmill/opsmill-speckit/main/catalog/workflow-catalog.json"
    priority: 1
    install_allowed: true
    description: "OpsMill workflows"
  - name: "default"
    url: "https://raw.githubusercontent.com/github/spec-kit/main/workflows/catalog.json"
    priority: 2
    install_allowed: true
    description: "Official workflows"
  - name: "community"
    url: "https://raw.githubusercontent.com/github/spec-kit/main/workflows/catalog.community.json"
    priority: 3
    install_allowed: false
    description: "Community-contributed workflows (discovery only)"
