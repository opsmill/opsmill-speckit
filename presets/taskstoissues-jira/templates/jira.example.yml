---
# Consumer-owned Jira configuration for the taskstoissues-jira preset.
#
# Copy this file to `dev/jira.yml` at your repo root, fill in real values,
# and commit. The preset's vendor defaults (config/jira.yml) provide
# `default_issue_type` and `labels_default`; everything below overrides or
# extends them per top-level key at runtime.

# REQUIRED — Atlassian site hostname. Matched against
# getAccessibleAtlassianResources to resolve cloudId.
cloud: your-tenant.atlassian.net

# REQUIRED — Jira project key new issues are created in (e.g. IFC, INFP).
default_project_key: PROJ

# REQUIRED — custom field IDs for your Jira instance. Retrieve with
# mcp__claude_ai_Atlassian__getJiraIssueTypeMetaWithFields and paste below.
custom_fields:
  epic_link: customfield_XXXXX
  team: customfield_XXXXX
  # Optional / reserved for future use:
  # sprint: customfield_XXXXX
  # story_points: customfield_XXXXX

# Optional — uncomment to override vendor defaults shipped in the preset:
# default_issue_type: Task
# labels_default:
#   - spec-kit
#   - auto-generated
